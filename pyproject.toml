[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-poker-lab"
version = "0.1.0"
description = "Evolve no-limit Texas Hold'em bots with a local LLM."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "llm-poker-lab"}]
dependencies = [
    "pokerkit>=0.6,<0.8",
    "eval7>=0.1.10",
    "matplotlib>=3.8",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
poker-lab = "llm_poker_lab.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_poker_lab*"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib --cov=llm_poker_lab --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = false
source = ["llm_poker_lab"]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
